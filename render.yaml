services:
  # Python Backend API
  - type: web
    name: project-omni-backend
    runtime: docker
    dockerContext: python-backend
    dockerfilePath: python-backend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_PATH
        value: "/app/data/cleaned_crop_data.csv"
      - key: GEMINI_API_KEY
        value: "" # Set this in the Render dashboard

  # Next.js Frontend
  - type: web
    name: project-omni-frontend
    runtime: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "" # Set this to the backend's .onrender.com URL after it's deployed
